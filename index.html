<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para a minha Bebezinha 💕</title>
<style>
:root{--bg1:#12050b;--bg2:#3d0f22;--card:#2a0e1a;--text:#f3e4dc;--accent:#e0607e;--gold:#d9b27c;--soft:#ff8fb1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:"Dancing Script","Brush Script MT",cursive;font-size:2.6rem;margin:8px 0 6px;color:var(--gold);text-shadow:0 2px 14px rgba(217,178,124,.35)}
.sub{margin:0 0 6px;font-size:1.05rem;line-height:1.5}
.prog{margin:14px 0 22px;font-size:.95rem;opacity:.85}
.bar{height:8px;border-radius:8px;background:rgba(217,178,124,.18);overflow:hidden;max-width:260px;margin:8px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;justify-items:center;margin:10px 0 24px}
.g{width:84px;height:84px;border:1px solid rgba(217,178,124,.5);border-radius:50%;background:radial-gradient(circle at 30% 25%,#4a1830,var(--card));font-size:2.3rem;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 16px rgba(224,96,126,.25);animation:fl 3s ease-in-out infinite;position:relative;transition:transform .2s}
.g:nth-child(2n){animation-delay:-1s}.g:nth-child(3n){animation-delay:-2s}
.g:active{transform:scale(.9)}
.g.done{opacity:.55;animation:none}
.g.done::after{content:"✓";position:absolute;right:-2px;top:-2px;background:var(--gold);color:#2a0e1a;border-radius:50%;width:24px;height:24px;font-size:.85rem;line-height:24px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.final{display:none;margin-top:10px}
.final.show{display:block;animation:pop .6s}
.btn{border:none;background:linear-gradient(135deg,#e6c795,#c79a5e);color:#2a0e1a;font:inherit;font-weight:600;font-size:1.1rem;padding:14px 26px;border-radius:30px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hint{font-size:.9rem;opacity:.75}
.ov{position:fixed;inset:0;background:rgba(40,10,25,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.show{display:flex}
.card{background:var(--card);border-radius:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 22px 22px;border:1px solid rgba(217,178,124,.4);box-shadow:0 14px 40px rgba(0,0,0,.6);animation:pop .4s}
.card .em{font-size:2.6rem}
.card h2{font-family:"Dancing Script","Brush Script MT",cursive;font-size:1.9rem;color:var(--gold);margin:6px 0 10px}
.card p{line-height:1.65;font-size:1.05rem;margin:0 0 18px;white-space:pre-line}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.p{position:fixed;pointer-events:none;font-size:1.4rem;z-index:30;animation:up 2.2s ease-out forwards}
@keyframes up{to{transform:translateY(-70vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<main>
<h1>Bom dia, Bebezinha 💕</h1>
<p class="sub">Fiz esta cartinha só para você.<br>Toque em cada coração e estrela para descobrir uma mensagem.</p>
<div class="prog"><span id="cnt">0 de 6 mensagens abertas</span><div class="bar"><i id="fill"></i></div></div>
<div class="grid" id="grid"></div>
<div class="final" id="final">
<p class="hint">Você abriu todas! Falta só uma…</p>
<button class="btn" id="fbtn">Abrir a última mensagem 💌</button>
</div>
</main>
<div class="ov" id="ov"><div class="card"><div class="em" id="em"></div><h2 id="tt"></h2><p id="tx"></p><button class="btn" id="close">Fechar</button></div></div>
<script>
var M=[
{e:"☀️",t:"Bom dia, meu amor",x:"Abra bem os olhinhos e respire fundo. A primeira coisa que quero que você saiba hoje é que alguém acordou a pensar em você, como acontece todos os dias."},
{e:"📚",t:"Tudo começou com um trabalho",x:"Foi na escola. Você pediu para fazermos um trabalho juntos e eu nem imaginava que ali começava o melhor projeto da minha vida: nós dois."},
{e:"📱",t:"Aquele número",x:"Você me deu o seu número e a gente conversava até tarde, sem ver o tempo passar. Eu já estava apaixonado e ainda tentava disfarçar. 😅"},
{e:"🍦",t:"Domingo, igreja e sorvete",x:"Lembra do dia em que você foi comigo à igreja e conheceu a minha irmã? Depois fomos tomar sorvete. Foi ali que senti que você já fazia parte da minha vida."},
{e:"😍",t:"O que eu amo em você",x:"Tudo. O seu sorriso, o seu jeito de rir, o seu jeito de ser. Até as coisas pequenas que só eu reparo fazem o meu coração ficar quentinho."},
{e:"🤍",t:"Obrigado por ficar",x:"Muitas coisas aconteceram, coisas que fariam outras pessoas irem embora. Você ficou. Ficou do meu lado, me aguentou e continuou a acreditar em nós. Nunca vou esquecer isso."}
];
var F={e:"💌",t:"Para a minha Bebezinha",x:"Um ano e quatro meses depois, continuo a escolher você todos os dias.\n\nObrigado por ser a minha paz, a minha companhia e o meu sorriso favorito. Prometo cuidar de você, respeitar você e fazer de tudo para te fazer feliz.\n\nVocê é o meu presente. Eu te amo muito, muito! 💖\n\nSeu Saitama"};
var I=["💗","⭐","💖","🌟","💕","✨","💝"],opened=0,grid=document.getElementById("grid");
function show(m){document.getElementById("em").textContent=m.e;document.getElementById("tt").textContent=m.t;document.getElementById("tx").textContent=m.x;document.getElementById("ov").classList.add("show");burst(m.e)}
function burst(){for(var i=0;i<14;i++){var s=document.createElement("span");s.className="p";s.textContent=["💖","✨","💕","⭐"][i%4];s.style.left=Math.random()*90+"vw";s.style.bottom="-10px";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),3000)}}
M.forEach(function(m,i){var b=document.createElement("button");b.className="g";b.textContent=I[i];b.setAttribute("aria-label","Abrir mensagem "+(i+1));b.onclick=function(){show(m);if(!b.classList.contains("done")){b.classList.add("done");opened++;document.getElementById("cnt").textContent=opened+" de 6 mensagens abertas";document.getElementById("fill").style.width=(opened/6*100)+"%";if(opened===6)document.getElementById("final").classList.add("show")}};grid.appendChild(b)});
document.getElementById("close").onclick=function(){document.getElementById("ov").classList.remove("show")};
document.getElementById("fbtn").onclick=function(){show(F)};
</script>
</body>
</html>
